{% extends "base.html" %}
{% block title %}Trang chủ{% endblock %}
{% block page_title %}Trang chủ{% endblock %}
{% block page_subtitle %}Chào mừng, {{ user.full_name }}{% endblock %}

{% block content %}
<div class="row g-3 qes-stats">
  {% for label, value in stats %}
    <div class="col-12 col-md-4">
      <div class="qes-card qes-stat p-3 h-100">
        <div class="qes-subtitle small">{{ label }}</div>
        <div class="fs-3 fw-bold">{{ value }}</div>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
